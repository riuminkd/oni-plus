 inf_calc.shinukhorchi.elaborate_rituals:0 "Elaborate Rituals"
 inf_calc.shinukhorchi.elaborate_rituals.d:0 "The Shinukhorchi ask for commitment to the faith!\n\nEffects for §Y10 years§!:\nShinukhorchi influence gain: §G+1.0§!\nGlobal Tax Modifier: §R-20%§!\nStability Cost Modifier: §R+10%§!\nChurch Power Modifier: §G+5%§!"
 inf_calc.shinukhorchi.thorough_inquisition:0 "Thorough Inquisition"
 inf_calc.shinukhorchi.thorough_inquisition.d:0 "The Shinukhorchi ask permission to root out doctrinal enemies with broad authority.\n\nEffects for §Y10 years§!:\nShinukhorchi influence gain: §G+1.0§!\nTolerance of Heretics: §R-2§!\nClergy Influence: §Y+10%§!\nMissionary Strength: §G+1%§!"
 inf_calc.chumijemoya.suffocating_secrecy:0 "Suffocating Secrecy"
 inf_calc.chumijemoya.suffocating_secrecy.d:0 "The Chumijemoya ask for cyphers, shadows and paranoia - secrets are to be guarded at all cost!.\n\nEffects for §Y10 years§!:\nChumijemoya influence gain: §G+1.0§!\nGlobal Tax Modifier: §R-20%§!\nSpy Offence: §R-20%§!\nSpy Defence: §G+20%§!"
 inf_calc.chumijemoya.shadow_overseers:0 "Shadow Overseers"
 inf_calc.chumijemoya.shadow_overseers.d:0 "The Chumijemoya demand tightened grip over subject courts.\n\nEffects for §Y10 years§!:\nChumijemoya influence gain: §G+1.0§!\nImprove Relations: §R-20%§!\nDiplomats: §R-1§!\nLiberty Desire from Subject Development: §G-20%§!"
 inf_calc.ajgriijarul.gruesome_displays:0 "Gruesome Displays"
 inf_calc.ajgriijarul.gruesome_displays.d:0 "The Ajgriijarul demand public spectacles of strength and terror.\n\nEffects for §Y10 years§!:\nAjgriijarul influence gain: §G+1.0§!\nAggressive Expansion Impact: §R+10%§!\nDiplomatic Reputation: §R-1§!\nMorale Damage Dealt: §G+10%§!"
 inf_calc.ajgriijarul.lethal_duels:0 "Lethal Duels for Aspirants"
 inf_calc.ajgriijarul.lethal_duels.d:0 "The Ajgriijarul demand weak to be weeded out.\n\nEffects for §Y10 years§!:\nAjgriijarul influence gain: §G+1.0§!\nManpower Recovery Speed: §R-10%§!\nDrill Gain Modifier: §R-20%§!\nYearly Army Tradition: §G+0.5§!"
 inf_calc.khelorvalshi.soultithe:0 "Soultithe"
 inf_calc.khelorvalshi.soultithe.d:0 "The Khelorvalshi ask for test subjects and unrestricted experimentation.\n\nEffects for §Y10 years§!:\nKhelorvalshi influence gain: §G+1.0§!\nNational Unrest: §R+2§!\nDevelopment Cost: §R+10%§!\nMana Regeneration: §G+0.3§!"
 inf_calc.khelorvalshi.temple_expedition_focus:0 "Temple Expedition Focus"
 inf_calc.khelorvalshi.temple_expedition_focus.d:0 "The Khelorvalshi ask to redouble efforts to breach and study High Temples.\n\nEffects for §Y10 years§!:\nKhelorvalshi influence gain: §G+1.0§!\nLand Force Limit: §R-10%§!\nSiege Ability: §R-5%§!\nTechnology Cost: §G-5%§!"
 inf_calc.kabiurgarko.harsh_quotas:0 "Harsh Quotas"
 inf_calc.kabiurgarko.harsh_quotas.d:0 "The Kabiurgarko demand harsher extraction quotas from the provinces.\n\nEffects for §Y10 years§!:\nKabiurgarko influence gain: §G+1.0§!\nYears of Separatism: §R+4§!\nNational Unrest: §R+2§!\nProduction Efficiency: §G+10%§!"
 inf_calc.kabiurgarko.foreigner_access:0 "Increased Foreigner Access"
 inf_calc.kabiurgarko.foreigner_access.d:0 "The Kabiurgarko want to open more routes to access foreign wealth.\n\nEffects for §Y10 years§!:\nKabiurgarko influence gain: §G+1.0§!\nSpy Defence: §R-30%§!\nTolerance of the True Faith: §R-1§!\nForeign Trade Power: §G+10%§!"
