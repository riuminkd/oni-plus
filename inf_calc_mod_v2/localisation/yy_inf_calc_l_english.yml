 inf_calc_kabiurgarko_impossible_architecture_tt:0 "For §Y1 year§!, the Kabiurgarko reshape every owned province for construction: each province gains space for another building and terrain no longer obstructs development.\n\nMonthly Kabiurgarko influence gain: §R-2.0§! for §Y10 years§!."
 inf_calc_kabiurgarko_energy_bending_tt:0 "For §Y10 years§!: §G-5%§! all power costs and §YEvocation Spells§! cost §G25%§! less Mana.\nMonthly Kabiurgarko influence gain: §R-2.0§! for §Y10 years§!."
 inf_calc_major_ajgriijarul_tt:0 "Requires §Y70§! Ajgriijarul influence. Open Ajgriijarul major boon choices."
 inf_calc_ajgriijarul_bright_tooth_claw_tt:0 "For §Y10 years§!, won battles grant administrative, diplomatic, military, and magical power based on casualties suffered and inflicted, divided by forty times our force limit.\nIf §YDangerous foe§! is active, this is divided by twenty times our force limit instead.\nMonthly Ajgriijarul influence gain: §R-2.0§! for §Y10 years§!."
 inf_calc_ajgriijarul_ritual_humiliation_tt:0 "For §Y10 years§!, main war enemies defeated by us at §Y50%§! or higher war score suffer a humiliation modifier based on their revanchism, status, rank, rivalry, force limit, and prestige.\nThe second-strongest tier requires §Y50%§! war score. The strongest tier requires §Y80%§! war score.\nMonthly Ajgriijarul influence gain: §R-2.0§! for §Y10 years§!."
 inf_calc_major_shinukhorchi_tt:0 "Requires §Y70§! Shinukhorchi influence. Open Shinukhorchi major boon choices."
 inf_calc_shinukhorchi_major_boon_tt:0 "Remove §YDevoured§! if present and gain §G200§! Church Power.\nMonthly Shinukhorchi influence gain: §R-2.0§! for §Y10 years§!."
 inf_calc_shinukhorchi_mind_control_tt:0 "For §Y10 years§!: diplomatic reputation penalties are compensated up to zero, with extra compensation for Diplomatic and Influence reputation ideas, active diplomatic reputation policies and gov reforms.\nFor §Y2 months§!: diplomatic reputation is increased by §G+10§!, vassalization acceptance is increased by §G+50§!, and countries with manageable aggressive expansion gain §G+200§! opinion and §G+10§! trust.\nAfterwards they lose §R10§! trust and gain §R-50§! opinion, decaying by §Y4§! yearly.\nFor §Y10 years§!: subject liberty desire is reduced by §G30§!.\nMonthly Shinukhorchi influence gain: §R-2.0§! for §Y10 years§!."
 inf_calc_shinukhorchi_warriors_of_the_mist_unavailable_tt:0 "§RThis boon has no effect unless §YDangerous foe§! is active.§!"
 inf_calc_major_khelorvalshi_tt:0 "Requires §Y70§! Khelorvalshi influence. Open Khelorvalshi major boon choices."
 inf_calc_khelorvalshi_lifeblood_tt:0 "For §Y10 years§!, owned and controlled §YDamestear§! provinces increase Mages Mana Regen.\nBase: §G+0.05§!\nWith a §YMage Tower§!: §G+0.05§!\nWith a §YRich Damestear Deposit§!: §G+0.05§!\nMonthly Khelorvalshi influence gain: §R-2.0§! for §Y10 years§!."
 inf_calc_khelorvalshi_unstable_magic_tt:0 "For §Y10 years§!, once each year we gain a random discount for the next spell cast. Any unused spell discount is replaced by the new one.\nPossible discounts: §Y50%§!, §Y100%§!, or §Y25%§!.\nMonthly Khelorvalshi influence gain: §R-2.0§! for §Y10 years§!."
 inf_calc_major_chumijemoya_tt:0 "Requires §Y70§! Chumijemoya influence. Open Chumijemoya major boon choices."
 inf_calc_chumijemoya_concealed_paths_tt:0 "For §Y2 years§!: armies can bypass forts and use force march for free.\nMonthly Chumijemoya influence gain: §R-2.0§! for §Y10 years§!."
 inf_calc_chumijemoya_choking_mist_tt:0 "For §Y2 years§!, all enemies at war with us suffer §R-100%§! global supply limit.\nIf we have §Y50§! spy network in a target, spend §Y50§! spy network to increase this to §R-150%§!.\nIf we have §Y75§! spy network in a target, spend §Y75§! spy network to increase this to §R-200%§!.\nMonthly Chumijemoya influence gain: §R-2.0§! for §Y10 years§!."
 inf_calc_chumijemoya_choking_mist_peace_tt:0 "§RThis boon has no effect while we are at peace.§!"
