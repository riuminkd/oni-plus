 unlock_khappur_sappers_tooltip:0 "Unlocks the Nobility privilege §TSappers of Khappur§!."
 estate_chumijemoya_khappur_sappers:0 "Sappers of Khappur"
 estate_chumijemoya_khappur_sappers_desc:0 "The Khappur district of Sarisung has a well-earned reputation as a haven for gangs, brigands, and organised crime of all sorts. With Chumijemoya influence opening the way, our nobles can fold Khappur's saboteurs and assassin guilds into the army's siegecraft. In exchange for greater noble autonomy, these sappers will help bring enemy fortresses down."
