 inf_calc.2.t:0 "Shirgrii Influence Interface"
 inf_calc.2.d:0 "§YInfluence 10§!     §YInfluence 30§!     §YInfluence 50§!     §YInfluence 70§!     §YInfluence 90§!     §YCurrent / Last Month§!\n\nKabiurgarko      §Y[Root.kabiurgarko_inf.GetValue]§! / §G[Root.kabiurgarko_inf_delta.GetValue]§!\nAjgriijarul      §Y[Root.ajgriijarul_inf.GetValue]§! / §G[Root.ajgriijarul_inf_delta.GetValue]§!\nShinukhorchi     §Y[Root.shinukhorchi_inf.GetValue]§! / §G[Root.shinukhorchi_inf_delta.GetValue]§!\nKhelorvalshi     §Y[Root.khelorvalshi_inf.GetValue]§! / §G[Root.khelorvalshi_inf_delta.GetValue]§!\nChumijemoya      §Y[Root.chumijemoya_inf.GetValue]§! / §G[Root.chumijemoya_inf_delta.GetValue]§!"
