 inf_calc.16.t:0 "Defenders Drained"
 inf_calc.16.d:0 "Khelorvalshi magic has drained the defenders of §Y[inf_calc_khelorvalshi_drain_target.GetName]§!, weakening the garrison and hastening the inevitable fall."
 inf_calc.16.a:0 "Good"
 inf_calc.17.t:0 "Mind Control Ends"
 inf_calc.17.d:0 "The Shinukhorchi influence over foreign minds fades."
 inf_calc.18.t:0 "Unstable Magic"
 inf_calc.18.d:0 "The Khelorvalshi twist the flow of magic."
 inf_calc.61.t:0 "Shirgrii Possession Defended"
 inf_calc.61.d:0 "The Shirgrii tied to §Y[Root.GetName]§! have rallied its defenses, slowing the ongoing siege."
 inf_calc.61.a:0 "Good"
 inf_calc.62.t:0 "Shirgrii Defenses Rally"
 inf_calc.62.d:0 "The Shirgrii tied to §Y[inf_calc_shirgrii_defense_target.GetName]§! have rallied its defenses against our siege."
 inf_calc.62.a:0 "Troublesome"
 inf_calc.63.t:0 "Mending Walls"
 inf_calc.63.d:0 "Kabiurgarko benders willed fortifications in §Y[inf_calc_shirgrii_defense_target.GetName]§! back into shape, frustrating besiegers!"
 inf_calc.64.t:0 "Mist or Beast?"
 inf_calc.64.d:0 "Chumijemoya never respond head on. Punishmnet for assailing §Y[inf_calc_shirgrii_defense_target.GetName]§! was meted out on one of enemy's high ranking commander. Their end was neither swift nor merciful."
 inf_calc.65.t:0 "Daring Sortie"
 inf_calc.65.d:0 "Ajgriijarul warriors have burst from §Y[inf_calc_shirgrii_defense_target.GetName]§!, wrecking enemy siege engines before vanishing behind the walls."
 inf_calc.66.t:0 "Highest Fire"
 inf_calc.66.d:0 "Shinukhorchi fire has descended on the approaches to §Y[inf_calc_shirgrii_defense_target.GetName]§!, leaving death and ruin in its wake. The dark fire will avail us!"
 inf_calc.67.t:0 "Black Jade Maze"
 inf_calc.67.d:0 "Khelorvalshi magic has folded the approaches to §Y[inf_calc_shirgrii_defense_target.GetName]§! into a maze they are famed for."
 inf_calc.68.d:0 "Kabiurgarko benders have undone our progress at §Y[inf_calc_shirgrii_defense_target.GetName]§!. Stone and wood alike mend at their command!"
 inf_calc.69.d:0 "Assaulting Chumijemoya possessions at §Y[inf_calc_shirgrii_defense_target.GetName]§! prompted unforeseen retaliation. One of our commanders vanished at night, with bone-chilling screams being their last words."
 inf_calc.70.d:0 "Ajgriijarul warriors launched a sortie from §Y[inf_calc_shirgrii_defense_target.GetName]§!, destroying some of our siege engines!"
 inf_calc.71.d:0 "Shinukhorchi fire has turned the approaches to §Y[inf_calc_shirgrii_defense_target.GetName]§! into an all-consuming blaze!"
 inf_calc.72.d:0 "Khelorvalshi magic has twisted the siege lines at §Y[inf_calc_shirgrii_defense_target.GetName]§! into a maze from which few return."
 inf_calc.shirgrii_defense.ok:0 "Such is our ancient power!"
 inf_calc.shirgrii_defense.bad:0 "Troublesome"
