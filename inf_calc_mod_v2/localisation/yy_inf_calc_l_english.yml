 inf_calc.79.t:0 "An Eternal [Root.Monarch.GetTitle]"
 inf_calc.79.desc:0 "The ancient, profane rites have made [Root.Monarch.GetName] a vessel for power that lesser rulers could not survive. But how openly should it be wielded?"
 inf_calc.79.a:0 "Let the world know what stands before it."
 inf_calc.79.b:0 "Demon warriors are on the march!"
 inf_calc.79.c:0 "Oni's knowledge is greater than young races can comprehend!"
 inf_calc.79.d:0 "Perhaps there is such thing as too much power..."
 inf_calc.79.e:0 "Let's not reveal our hand."
 inf_calc_eternal_tamongor_become_witch_king_tt:0 "[Root.Monarch.GetName] will become a §YWitch-King§!."
 azjakuma_masterful_tamongor_inf_calc_tooltip:0 "Influence penalty from other Shirgrii is reduced by §G30%§!."
 inf_calc_azjakuma_ritual_additional_effects_tt:0 "Additional Shirgrii effects:\n- Active Shirgrii spell mana strain is reduced.\n- Owned provinces with a fort, ramparts, and mage tower can have Shirgrii control applied, like High Temples.\n- A ruler who has completed the final life extension can be sustained eternally by Inu Ekuesnambi, strengthening Shirgrii influence."
 desc_azjakuma_ritual_modifier:0 "Additional Shirgrii effects:\n- Active Shirgrii spell mana strain is reduced.\n- Owned provinces with a fort, ramparts, and mage tower can receive Shirgrii control if their area has no temple control or Shirgrii possession.\n- A ruler who has completed the final life extension can be sustained eternally by Inu Ekuesnambi, strengthening Shirgrii influence and spell capacity."
 inf_calc_true_immortality:0 "True Immortality"
 desc_inf_calc_true_immortality:0 "Inu Ekuesnambi reners [Root.Monarch.GetName] truly eternal, binding the Shirgrii more closely to the immortal throne."
 inf_calc.81.t:0 "True Immortality"
 inf_calc.81.d:0 "The energies of Inu Ekuesnambi coil around [Root.Monarch.GetName], feeding the ruler's flesh and spirit with a current that shall never fade. What lesser beings call age and enthropy is only another weakness to be consumed.\n\nPower and knowledge of countless spirits is feeds into Tamongor's mind, making him a being far above even the most gifted mortal mage or ancient lich. [Root.Monarch.GetName] may show the world what true Witch-king is, or let immortality alone suffice."
 inf_calc.81.a:0 "No mere Witch-king, perhaps Tamongor should be called god now!"
 inf_calc.81.b:0 "Let the wealth and control grow beyond measure!"
 inf_calc.81.c:0 "Let the lesser minds be but playthings to him!"
 inf_calc.81.e:0 "Immortality is enough."
 inf_calc.80.t:0 "What Oni+ mod changes and adds"
 inf_calc.80.d:0 "This submod replaces old Shirgrii estate handling for [Root.GetName] with a custom Shirgrii influence system.\n\nCore mechanics:\n- Open the Shirgrii interface from the decision menu.\n- Five Shirgrii track influence monthly from linked provinces, buildings, local conditions, concessions, pacts, spells, and temple control.\n- Concessions and pacts raise influence but add tradeoffs.\n- Spells and Spells+ spend influence over time and use mana, with cost greatly increasing with number of spells active at once.\n- Low mana with negative mana regeneration causes §Ymana drought§!, reducing all Shirgrii influence gain.\n- Temple complexes can be assigned to a Shirgrii faction. Controlled temples and old Shirgrii possessions can defend themselves during sieges.\n- After §Yfinal mission§!, fortified mage-tower/rampart provinces can also receive Shirgrii control when their area has no existing controlled temple or Shirgrii possession.\n\nMission integration:\n- Old Shirgrii estate checks and rewards have been redirected to this influence system.\n- Tamongor missions improve control over Shirgrii rivalry and Witch-King progression"
 inf_calc.80.a:0 "Understood"
